<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>環景 3D</title>
<style>
  /* 車機夜間 HUD：單一深色主題。字型用系統字（車機離線、不連 Google Fonts） */
  :root{
    --bg:#090d13; --panel:rgba(14,20,28,.8); --line:rgba(120,160,200,.18);
    --fg:#e8f1f8; --muted:#8ba1b4;
    --cyan:#38e1ff; --amber:#ffc24b; --green:#5ef08a; --violet:#b58cff; --red:#ff5a4d; --orange:#ff8a3d;
    color-scheme:dark;
  }
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;
    font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #app{position:relative;width:100%;height:100%}
  canvas{display:block}
  .hud{position:absolute;z-index:5}

  .panel{top:10px;left:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px;pointer-events:none;min-width:122px}
  .panel h1{margin:0 0 6px;font-size:12px;letter-spacing:.14em;font-weight:700}
  .rows{display:flex;flex-direction:column;gap:5px}
  .row{display:flex;align-items:center;gap:8px;font-size:13px}
  .dot{width:9px;height:9px;border-radius:3px;flex:none}
  .row .nm{color:var(--muted);flex:1}
  .row .ct{font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
  .stat{margin-top:8px;font-size:11px;color:var(--muted);line-height:1.55;font-variant-numeric:tabular-nums}
  .stat .bad{color:var(--red)}

  .alert{top:10px;left:50%;transform:translateX(-50%);background:rgba(255,90,77,.18);border:1px solid rgba(255,90,77,.6);color:#ff8278;padding:6px 14px;border-radius:999px;font-weight:700;letter-spacing:.12em;font-size:13px;pointer-events:none;animation:blink 1s infinite;white-space:nowrap}
  @keyframes blink{50%{opacity:.35}}
  .wait{top:50%;left:50%;transform:translate(-50%,-50%);color:var(--muted);font-size:14px;letter-spacing:.06em;background:var(--panel);padding:10px 16px;border-radius:10px;border:1px solid var(--line);pointer-events:none;text-align:center;line-height:1.6}

  .dock{left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px}
  .dock .sep{flex:none;width:1px;margin:6px 3px;background:var(--line)}
  button{font:inherit;font-size:12px;font-weight:600;color:var(--muted);background:transparent;border:0;border-radius:8px;padding:8px 11px;white-space:nowrap}
  button:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
  .dock button[aria-pressed="true"]{background:rgba(56,225,255,.16);color:var(--cyan)}
  .dock button.g[aria-pressed="true"]{background:rgba(94,240,138,.16);color:var(--green)}
  .topbtn{position:absolute;top:10px;right:10px;z-index:6;background:var(--panel);border:1px solid var(--line)}
  .topbtn[aria-pressed="true"]{color:var(--amber);border-color:rgba(255,194,75,.5)}

  .cal{top:50px;right:10px;width:260px;max-height:calc(100% - 112px);overflow:auto;background:var(--panel);border:1px solid rgba(255,194,75,.45);border-radius:12px;padding:10px 12px;font-size:12px}
  .cal h2{margin:0 0 4px;font-size:12px;color:var(--amber);letter-spacing:.1em}
  .cal p{margin:0 0 8px;color:var(--muted);line-height:1.5}
  .cal label{display:flex;align-items:center;gap:8px;margin:8px 0}
  .cal label span{width:58px;color:var(--muted);flex:none}
  .cal input[type=range]{flex:1;min-width:0;accent-color:var(--amber)}
  .cal output{width:46px;text-align:right;font-variant-numeric:tabular-nums;flex:none}
  .cal .chk span{width:auto}
  .cal input[type=checkbox]{accent-color:var(--amber)}
  .cal .act{display:block;width:100%;margin:10px 0 0;color:var(--amber);background:rgba(255,194,75,.08);border:1px solid rgba(255,194,75,.45)}
  .cal .msg{margin:6px 0 0;color:var(--fg)}

  /* 號誌：右下角，避開統計面板、預警、校正鈕與 dock（太窄時由 JS 移到 dock 上方） */
  .tl{right:10px;bottom:10px;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 11px 6px 7px;pointer-events:none}
  .tl .lamps{display:flex;gap:5px;background:#05070a;border:1px solid rgba(120,160,200,.14);border-radius:9px;padding:5px 6px}
  .tl i{display:block;width:16px;height:16px;border-radius:50%;background:#1a2028}
  .tl.s-red i.r{background:#ff4b3e;box-shadow:0 0 10px rgba(255,75,62,.85)}
  .tl.s-yellow i.y{background:#ffc533;box-shadow:0 0 10px rgba(255,197,51,.85)}
  .tl.s-green i.g{background:#35f08f;box-shadow:0 0 10px rgba(53,240,143,.85)}
  .tl .tx{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--muted)}
  .tl.s-red .tx{color:#ff8278}
  .tl.s-yellow .tx{color:var(--amber)}
  .tl.s-green .tx{color:#6ff5ad}

  .tag{font-size:12px;font-weight:600;padding:2px 7px;border-radius:7px;white-space:nowrap;background:rgba(9,13,19,.82);border:1px solid var(--line);color:var(--fg);transform:translateY(-4px)}
  .tag.car{border-color:rgba(56,225,255,.55)}
  .tag.van{border-color:rgba(120,200,255,.55)}
  .tag.truck{border-color:rgba(181,140,255,.55)}
  .tag.bus{border-color:rgba(145,120,220,.55)}
  .tag.moto{border-color:rgba(255,194,75,.55)}
  .tag.bigbike{border-color:rgba(255,160,60,.6)}
  .tag.bike{border-color:rgba(255,220,130,.55)}
  .tag.ped{border-color:rgba(94,240,138,.55)}
  .tag.cone{border-color:rgba(255,138,61,.6)}
  .tag.danger{border-color:var(--red);color:#ff8278}
  /* map3d 的 HUD 位置由宿主決定：放右欄，避開左上計數、左下盲點警示、右下號誌。
     選擇器要比 map3d.js 後注入的 .amap 更具體，align-items 才蓋得過去 */
  #app .amap{position:absolute;right:10px;top:52px;z-index:4;align-items:flex-end}
  .tag b{margin-left:4px;font-variant-numeric:tabular-nums}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div id="app">
  <div class="hud panel" role="status" aria-label="周遭偵測統計">
    <h1>周遭偵測</h1>
    <div class="rows" id="rows"></div>
    <div class="stat" id="stat">—</div>
  </div>
  <div class="hud alert" id="alert" hidden>⚠ 碰撞預警</div>
  <div class="hud wait" id="wait">等待偵測資料…<br><small>把全景360 切到俯視畫面</small></div>
  <div class="hud tl" id="tl" role="status" aria-label="號誌" hidden>
    <span class="lamps"><i class="r"></i><i class="y"></i><i class="g"></i></span><span class="tx" id="tlTx">未亮</span>
  </div>

  <button class="topbtn" id="calBtn" aria-pressed="false">校正</button>
  <div class="hud cal" id="cal" hidden>
    <h2>俯視區校正</h2>
    <p>拖動滑桿，讓螢幕上的黃色虛線框剛好框住全景360 的俯視圖。</p>
    <label><span>左緣</span><input type="range" id="cL" min="0" max="100" step="0.5"><output id="oL"></output></label>
    <label><span>右緣</span><input type="range" id="cR" min="0" max="100" step="0.5"><output id="oR"></output></label>
    <label><span>上緣</span><input type="range" id="cT" min="0" max="100" step="0.5"><output id="oT"></output></label>
    <label><span>下緣</span><input type="range" id="cB" min="0" max="100" step="0.5"><output id="oB"></output></label>
    <label><span>橫向寬度</span><input type="range" id="cM" min="2" max="30" step="0.5"><output id="oM"></output></label>
    <p>寬度＝俯視圖左右兩邊之間的實際公尺數。對照方式：3D 裡自車寬 1.9 m，調到實景地面上的車身跟 3D 車身一樣寬。</p>
    <label class="chk"><input type="checkbox" id="cF"><span>俯視圖車頭朝下（翻轉）</span></label>
    <label class="chk"><input type="checkbox" id="cO"><span>只偵測俯視區（較快較準）</span></label>
    <button class="act" id="capBtn">存截圖（校正用）</button>
    <p class="msg" id="capMsg" role="status" hidden></p>
  </div>

  <div class="hud dock" id="dock">
    <button data-view="top">俯視</button>
    <button data-view="chase" aria-pressed="true">3D 跟車</button>
    <button data-view="orbit">繞行</button>
    <span class="sep" aria-hidden="true"></span>
    <button class="g" data-ground="real" aria-pressed="false">實景</button>
    <button class="g" data-ground="virtual" aria-pressed="false">虛擬道路</button>
  </div>
</div>

<script src="lib/three.min.js"></script>
<script src="lib/OrbitControls.js"></script>
<script src="lib/CSS2DRenderer.js"></script>
<script src="lib/RoomEnvironment.js"></script>
<script src="lib/GLTFLoader.js"></script>
<script src="models.js"></script>
<script src="roadusers.js"></script>
<script src="vehicle3d.js"></script>
<script src="map3d.js"></script>
<script src="lca3d.js"></script>
<script>
(function () {
  'use strict';
  // 座標約定：自車在原點，車頭朝 -Z；x 正 = 右側。Android 送來的 z 是「前方公尺」，進場景時取負號。
  var Bridge = window.AndroidBridge || null;
  var DEMO = location.hash.indexOf('demo') >= 0;
  var DEMO_CAM = location.hash.indexOf('demo-cam') >= 0;
  var app = document.getElementById('app');
  var COL = { cyan: 0x38e1ff, amber: 0xffc24b, green: 0x5ef08a, violet: 0xb58cff, red: 0xff5a4d, orange: 0xff6a14,
    asphalt: 0x11171f, ego: 0xeaf7ff, glass: 0x0c161d };
  var NAMES = { car: '汽車', van: '箱型車', truck: '卡車', bus: '公車',
    moto: '機車', bigbike: '重機', bike: '自行車', ped: '行人', cone: '三角錐' };
  var RADIUS = { car: 0.9, van: 1.0, truck: 1.2, bus: 1.3,
    moto: 0.4, bigbike: 0.4, bike: 0.4, ped: 0.3, cone: 0.2 };   // 物件約略半寬(m)
  var GATE = { car: 2.5, van: 2.5, truck: 2.5, bus: 2.5,
    moto: 2.5, bigbike: 2.5, bike: 2.5, ped: 2.5, cone: 1.2 };   // 跨幀關聯距離門檻(m)
  var EGO_W = 1.9, EGO_L = 4.9, WARN = 1.2, CRIT = 0.5;          // 停車距離門檻(m)
  function hasFn(name) { return !!Bridge && typeof Bridge[name] === 'function'; }

  // ---------- renderer ----------
  var renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'low-power' });
  renderer.setPixelRatio(1);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  app.appendChild(renderer.domElement);

  var labels = new THREE.CSS2DRenderer();
  labels.domElement.style.cssText = 'position:absolute;top:0;left:0;pointer-events:none';
  app.appendChild(labels.domElement);

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(COL.asphalt);
  scene.fog = new THREE.Fog(COL.asphalt, 24, 70);
  try {
    var pm = new THREE.PMREMGenerator(renderer);
    scene.environment = pm.fromScene(new THREE.RoomEnvironment(), 0.04).texture;
  } catch (e) { /* 舊 WebView 不支援就只用燈光 */ }

  var camera = new THREE.PerspectiveCamera(50, 1, 0.1, 200);
  var controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.1;
  controls.minDistance = 4;
  controls.maxDistance = 45;
  controls.maxPolarAngle = Math.PI * 0.49;

  scene.add(new THREE.HemisphereLight(0x9fc4ff, 0x0a0f16, 0.6));
  var key = new THREE.DirectionalLight(0xffffff, 1.3);
  key.position.set(6, 14, 4);
  scene.add(key);

  // ---------- ground ----------
  var base = new THREE.Mesh(new THREE.PlaneGeometry(140, 140),
    new THREE.MeshBasicMaterial({ color: COL.asphalt }));   // 不受光：環境光會把柏油照成淺灰
  base.rotation.x = -Math.PI / 2;
  scene.add(base);
  var grid = new THREE.PolarGridHelper(16, 8, 4, 64, 0x2a3c50, 0x1b2a3a);
  grid.position.y = 0.01;
  scene.add(grid);

  // 實景地面：全景360 俯視圖即時貼圖（圖上方 = 車頭方向）
  var groundImg = new Image();
  var groundTex = new THREE.Texture(groundImg);
  groundTex.encoding = THREE.sRGBEncoding;
  groundTex.minFilter = THREE.LinearFilter;
  groundTex.generateMipmaps = false;
  var real = new THREE.Mesh(new THREE.PlaneGeometry(1, 1),
    new THREE.MeshBasicMaterial({ map: groundTex, toneMapped: false }));
  real.rotation.x = -Math.PI / 2;
  real.position.y = 0.02;
  real.visible = false;
  scene.add(real);
  var groundLoaded = false, groundLoading = false, groundPending = null, groundMode = 'real';
  groundImg.onload = function () {
    groundTex.image = groundImg;
    groundTex.needsUpdate = true;
    groundLoaded = true;
    real.visible = groundMode === 'real';
    groundLoading = false;
    if (groundPending) { var p = groundPending; groundPending = null; loadGround(p); }
  };
  groundImg.onerror = function () { groundLoading = false; };
  function loadGround(url) {
    if (groundLoading) { groundPending = url; return; }   // 只留最新一張
    groundLoading = true;
    groundImg.src = url;
  }

  // ---------- 虛擬道路（特斯拉風格：乾淨路面、路緣、平滑車道線） ----------
  function srgb(hex) { return new THREE.Color(hex).convertSRGBToLinear(); }   // 配 toneMapped:false，色碼原樣顯示
  var ROAD_Z = 40, DEF_EDGE = 5.25, CURB_W = 0.15, CURB_H = 0.12, WALK_W = 2.4;
  var road = new THREE.Group();
  road.visible = false;
  scene.add(road);
  function flat(hex, y) {
    var m = new THREE.Mesh(new THREE.PlaneGeometry(1, 2 * ROAD_Z), new THREE.MeshBasicMaterial({ color: srgb(hex),
      toneMapped: false, polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1 }));
    m.rotation.x = -Math.PI / 2;
    m.position.y = y;
    road.add(m);
    return m;
  }
  // 虛擬模式：不畫底板（路外直接是背景色，省一次全畫面填色），霧改成背景色原樣，路面遠處才淡進背景
  var fogCol = scene.fog.color.clone(), vFogCol = srgb(COL.asphalt);
  var strip = flat(0x262d36, 0.006);
  var walkL = flat(0x39414b, CURB_H), walkR = flat(0x39414b, CURB_H);
  walkL.scale.x = walkR.scale.x = WALK_W;
  var curbGeo = new THREE.BoxGeometry(CURB_W, CURB_H, 2 * ROAD_Z);
  var curbMat = new THREE.MeshLambertMaterial({ color: srgb(0xaab3bd) });
  var redCurbMat = new THREE.MeshLambertMaterial({ vertexColors: true });
  var redCurbGeo = (function () {   // 紅白相間路緣（台灣紅線），1 m 一段，合併成單一 draw call
    var n = 2 * ROAD_Z, box = new THREE.BoxGeometry(CURB_W, CURB_H, 1);
    var bp = box.attributes.position.array, bn = box.attributes.normal.array, bi = box.index.array, nv = bp.length / 3;
    var pos = new Float32Array(nv * n * 3), nor = new Float32Array(nv * n * 3), col = new Float32Array(nv * n * 3), idx = [];
    var red = srgb(0xe2362b), white = srgb(0xeef2f5);
    for (var s = 0; s < n; s++) {
      var c = s % 2 ? white : red, zc = -ROAD_Z + s + 0.5;
      for (var v = 0; v < nv; v++) {
        var o = (s * nv + v) * 3;
        pos[o] = bp[v * 3]; pos[o + 1] = bp[v * 3 + 1]; pos[o + 2] = bp[v * 3 + 2] + zc;
        nor[o] = bn[v * 3]; nor[o + 1] = bn[v * 3 + 1]; nor[o + 2] = bn[v * 3 + 2];
        col[o] = c.r; col[o + 1] = c.g; col[o + 2] = c.b;
      }
      for (var i = 0; i < bi.length; i++) idx.push(bi[i] + s * nv);
    }
    box.dispose();
    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    g.setIndex(idx);
    return g;
  })();
  function curb() {
    var m = new THREE.Mesh(curbGeo, curbMat);
    m.position.y = CURB_H / 2;
    road.add(m);
    return m;
  }
  var curbL = curb(), curbR = curb();

  // 路緣：payload 的 el/er 平滑；未知時退回 ±5.25 m 且不畫路緣、人行道
  var edgeL = { v: -DEF_EDGE, t: -DEF_EDGE, on: false }, edgeR = { v: DEF_EDGE, t: DEF_EDGE, on: false }, lastRoad = -1e9;
  function aimEdge(e, val, sign) {
    var ok = typeof val === 'number' && isFinite(val) && val * sign > 0.9;
    e.on = ok;
    e.t = ok ? sign * Math.min(Math.abs(val), 15) : sign * DEF_EDGE;
  }
  function sideEdge(c, wk, e, sign, red, half) {
    c.visible = wk.visible = e.on;
    c.position.x = e.v + sign * CURB_W / 2;
    wk.position.x = e.v + sign * (CURB_W + WALK_W / 2);
    c.scale.z = wk.scale.y = half / ROAD_Z;   // 跟路面一樣只畫看得到的長度
    c.geometry = red ? redCurbGeo : curbGeo;
    c.material = red ? redCurbMat : curbMat;
  }

  // 車道線：每條線一個軌跡（種類、角度 φ、法向偏移 ρ、沿線範圍 s0..s1、虛線相位）
  // 線方向 d = (sinφ, cosφ)，法向 n = (cosφ, −sinφ)，φ 從車軸（+z）往右量，正規化到 [−90°, 90°)
  var LINE_C = { w: srgb(0xeef2f5), y: srgb(0xffc533), r: srgb(0xff4b3e) }, LINE_W = { w: 0.15, y: 0.15, r: 0.2 };
  var DASH = 4, PERIOD = 10, MAXQ = 12, MAX_LINES = 16, LINE_Y = 0.014;
  var LINE_EXT = 2.5;    // 縱向線往觀測範圍外延伸的長度（m）
  var LINE_MIN_C = 0.45; // 信心低於此不畫：車身反光、鏡頭接縫、地面髒污都會湊出短短的「線」
  var LINE_MIN_M = 1.5;  // 實際看到的長度不足此值不畫（0.8 m 的東西延伸後變 5.8 m，放大 7 倍）
  var HALF = Math.PI / 2, LONG = 25 * Math.PI / 180, MATCH_A = 8 * Math.PI / 180;
  var LINE_IDX = (function () {
    var a = [];
    for (var q = 0; q < MAXQ; q++) a.push(q * 4, q * 4 + 1, q * 4 + 2, q * 4 + 2, q * 4 + 1, q * 4 + 3);
    return a;
  })();
  var lineTracks = [], linePool = [];
  function mod(a, m) { return ((a % m) + m) % m; }
  function angDiff(a, b) {   // 無向線的角度差 → [−90°, 90°)
    var d = a - b;
    while (d >= HALF) d -= Math.PI;
    while (d < -HALF) d += Math.PI;
    return d;
  }
  function lineObs(l) {
    if (!l) return null;
    var dx = l.x2 - l.x1, dz = l.z2 - l.z1;
    if (!(Math.hypot(dx, dz) > 0.05)) return null;   // 也擋掉 NaN
    var phi = Math.atan2(dx, dz);
    if (phi >= HALF) phi -= Math.PI; else if (phi < -HALF) phi += Math.PI;
    var sn = Math.sin(phi), cs = Math.cos(phi), a = l.x1 * sn + l.z1 * cs, b = l.x2 * sn + l.z2 * cs;
    return { k: LINE_C[l.k] ? l.k : 'w', d: !!l.d, phi: phi, rho: ((l.x1 + l.x2) * cs - (l.z1 + l.z2) * sn) / 2,
      s0: Math.min(a, b), s1: Math.max(a, b), c: typeof l.c === 'number' && isFinite(l.c) ? l.c : 1 };
  }
  function flipLine(tr) {   // 同一條線換成反方向表示（φ ± 180°）
    var s = tr.tphi >= 0 ? -Math.PI : Math.PI, a;
    tr.tphi += s; tr.phi += s;
    tr.trho = -tr.trho; tr.rho = -tr.rho;
    a = tr.ts0; tr.ts0 = -tr.ts1; tr.ts1 = -a;
    a = tr.s0; tr.s0 = -tr.s1; tr.s1 = -a;
    tr.tph = mod(tr.ts0, PERIOD); tr.ph = mod(tr.s0, PERIOD);
  }
  function aimLine(tr, o, fl, dp, now) {
    tr.tphi += dp;
    if (fl) { tr.trho = -o.rho; tr.ts0 = -o.s1; tr.ts1 = -o.s0; } else { tr.trho = o.rho; tr.ts0 = o.s0; tr.ts1 = o.s1; }

  if (MODELS && MODELS.prewarm) { try { MODELS.prewarm(renderer, scene, camera); } catch (e) { } }
  // 寫實 GLB 模型：懶載入，讀不到 manifest 就一直用程式建模的，不會壞。
  // 行人是骨骼動畫，GPU 不支援頂點貼圖時改用程式建模版。
  if (window.AVM_RU) {
    try { AVM_RU.init('models/', null, renderer.capabilities.floatVertexTextures); } catch (e) { }
  }
  if (window.AVM_VEH) AVM_VEH.init(scene, THREE, app, ego);
  if (window.AVM_MAP) AVM_MAP.init(scene, THREE, app);
  if (window.AVM_LCA) AVM_LCA.init(scene, THREE, app);

  // ---------- 停車格 ----------
  // payload.slots 已是車身座標公尺（Kotlin 端已套用 flip），空格綠色、有車灰色，入口邊較亮。
  var SLOT_MAX = 16, SLOT_Y = 0.035, SLOT_TTL = 1500;
  var slotCol = { free: srgb(COL.green), used: srgb(0x8b97a4), mouth: srgb(0xd8ffe6) };
  var slotGrp = new THREE.Group();
  scene.add(slotGrp);
  var slotPool = [];
  var slotsAt = -1e9;

  function makeSlot() {
    var fillG = new THREE.BufferGeometry();
    fillG.setAttribute('position', new THREE.BufferAttribute(new Float32Array(12), 3));
    fillG.setIndex([0, 1, 2, 0, 2, 3]);
    var fill = new THREE.Mesh(fillG, new THREE.MeshBasicMaterial({
      transparent: true, opacity: 0.16, side: THREE.DoubleSide, depthWrite: false,
      polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -4, toneMapped: false
    }));
    // 外框（5 點閉合）與入口邊（2 點）分開畫，入口邊才能加粗提亮
    var edgeG = new THREE.BufferGeometry();
    edgeG.setAttribute('position', new THREE.BufferAttribute(new Float32Array(15), 3));
    var edge = new THREE.Line(edgeG, new THREE.LineBasicMaterial({
      transparent: true, opacity: 0.85, depthWrite: false, toneMapped: false
    }));
    var mouthG = new THREE.BufferGeometry();
    mouthG.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3));
    var mouth = new THREE.Line(mouthG, new THREE.LineBasicMaterial({
      transparent: true, opacity: 1, depthWrite: false, toneMapped: false
    }));
    var g = new THREE.Group();
    g.add(fill); g.add(edge); g.add(mouth);
    g.userData = { fill: fill, edge: edge, mouth: mouth };
    slotGrp.add(g);
    slotPool.push(g);
    return g;
  }

  function drawSlots(list) {
    var n = list ? Math.min(list.length, SLOT_MAX) : 0, i, used = 0;
    for (i = 0; i < n; i++) {
      var s = list[i], p = s && s.p;
      if (!p || p.length < 8) continue;          // 壞掉的那一格跳過就好，不要連後面的也丟掉
      var g = slotPool[used] || makeSlot(), u = g.userData;
      var col = s.o ? slotCol.used : slotCol.free;
      var fp = u.fill.geometry.attributes.position, ep = u.edge.geometry.attributes.position;
      var mp = u.mouth.geometry.attributes.position, k;
      for (k = 0; k < 4; k++) {
        var x = p[k * 2], z = -p[k * 2 + 1];        // 車身 z 向前，場景取負號
        fp.array[k * 3] = x; fp.array[k * 3 + 1] = SLOT_Y; fp.array[k * 3 + 2] = z;
        ep.array[k * 3] = x; ep.array[k * 3 + 1] = SLOT_Y; ep.array[k * 3 + 2] = z;
      }
      ep.array[12] = ep.array[0]; ep.array[13] = SLOT_Y; ep.array[14] = ep.array[2];
      mp.array[0] = ep.array[0]; mp.array[1] = SLOT_Y; mp.array[2] = ep.array[2];
      mp.array[3] = ep.array[3]; mp.array[4] = SLOT_Y; mp.array[5] = ep.array[5];
      fp.needsUpdate = ep.needsUpdate = mp.needsUpdate = true;
      u.fill.geometry.computeBoundingSphere();
      u.edge.geometry.computeBoundingSphere();
      u.mouth.geometry.computeBoundingSphere();
      u.fill.material.color.copy(col);
      u.edge.material.color.copy(col);
      u.mouth.material.color.copy(s.o ? col : slotCol.mouth);
      u.fill.material.opacity = 0.10 + 0.12 * (typeof s.c === 'number' ? Math.max(0, Math.min(1, s.c)) : 1);
      g.visible = true;
      used++;
    }
    for (i = used; i < slotPool.length; i++) slotPool[i].visible = false;
  }

  // ---------- 號誌：前方約 18 m 的 3D 紅綠燈（橫式燈箱）+ HUD ----------
  var TL_C = { red: 0xff4b3e, yellow: 0xffc533, green: 0x35f08f };
  var TL_TX = { red: '紅燈', yellow: '黃燈', green: '綠燈', off: '未亮' };
  var TL_D = 18, TL_Y = 2.7;   // 燈箱高度壓低，跟車視角才看得到 18 m 外的燈
  var tlObj = new THREE.Group(), tlLamps = {}, lastTl = -1e9, tlState = '', tlAx = 0, tlAxT = 0;
  tlObj.visible = false;
  scene.add(tlObj);
  (function () {
    var dark = std(srgb(0x14171b), 0.2, 0.7);
    tlObj.add(mesh(new THREE.CylinderGeometry(0.07, 0.09, TL_Y, 10), std(srgb(0x5a636e), 0.6, 0.45), 0, TL_Y / 2, 0));
    tlObj.add(mesh(new THREE.BoxGeometry(1.44, 0.52, 0.3), dark, 0, TL_Y, 0));
    var lg = new THREE.CircleGeometry(0.17, 20), vg = new THREE.BoxGeometry(0.4, 0.03, 0.2);
    ['red', 'yellow', 'green'].forEach(function (s, i) {
      var x = (i - 1) * 0.46;
      // 燈面只靠自發光：底色黑、不反射環境，熄燈時留一點燈色
      var m = new THREE.MeshStandardMaterial({ color: 0x000000, emissive: srgb(TL_C[s]), emissiveIntensity: 0.05,
        roughness: 1, metalness: 0, toneMapped: false });
      m.envMapIntensity = 0;
      tlObj.add(mesh(lg, m, x, TL_Y, 0.152));
      tlObj.add(mesh(vg, dark, x, TL_Y + 0.2, 0.25));   // 遮陽罩
      tlLamps[s] = { m: m, x: x };
    });
  })();
  var tlGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: radialTex('rgba(255,255,255,.9)', 'rgba(255,255,255,0)'),
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false }));
  tlGlow.scale.set(1.05, 1.05, 1);
  tlGlow.visible = false;
  tlObj.add(tlGlow);
  var tlEl = document.getElementById('tl'), tlTx = document.getElementById('tlTx');
  function showTl(tl) {
    var s = TL_TX[tl.s] ? tl.s : 'off';
    tlAxT = (typeof tl.ax === 'number' && isFinite(tl.ax) ? Math.max(-60, Math.min(60, tl.ax)) : 0) * Math.PI / 180;
    if (s === tlState) return;
    tlState = s;
    tlEl.className = 'hud tl s-' + s;
    tlTx.textContent = TL_TX[s];
    tlEl.setAttribute('aria-label', '號誌：' + TL_TX[s]);

    tlGlow.visible = !!TL_C[s];
    if (TL_C[s]) {

      tlGlow.position.set(tlLamps[s].x, TL_Y, 0.3);
    }
  }

  // ---------- tracks（跨幀關聯，ID 穩定、位置平滑） ----------
  var tracks = [], nextId = 1;
  var POOL = { car: [], van: [], truck: [], bus: [], moto: [], bigbike: [], bike: [], ped: [], cone: [] };
  // 車色寫實隨機：每種車一組常見車色，依建立順序輪流取，pool 重用時外觀才穩定
  var PAINT = {
    car: [0xb9bec4, 0xe9ecef, 0x23272b, 0x2a5b8c, 0x7a1f28, 0x3f5d4a, 0xc9ccd1],
    van: [0xe8eaec, 0xd4d7da, 0x9aa3ad, 0x2f5f8f],
    truck: [0xd9dde2, 0xe8eaec, 0x2f6ea8, 0x8d939a],
    bus: [0x2f8f5b, 0xd8452f, 0x2f6ea8, 0xe0b23a],
    moto: [0xd8dde3, 0x23272b, 0xd8452f, 0x2f6ea8, 0x6b4a8f],
    bigbike: [0x1f4fb4, 0x23272b, 0x1f7f3f, 0xd8452f],
    bike: [0xf2a51a, 0x2f8f5b, 0x23272b, 0xe9ecef],
    ped: [0x5ef08a, 0x38e1ff, 0xffc24b, 0xff8aa8, 0xb58cff, 0xe9ecef, 0x4a6fa5]
  };
  var paintN = {};
  function paintFor(t) {
    var list = PAINT[t];
    if (!list) return undefined;
    var n = paintN[t] = (paintN[t] || 0) + 1;
    return list[(n - 1) % list.length];
  }
  // 寫實 GLB 模型（roadusers.js）為主，程式建模（models.js）當備援：
  // GLB 還沒載完、或車機載不動時先顯示程式建模的，載完 dress() 會自動換上。
  function buildFallback(t, col, seed) {
    if (MODELS) {
      return t === 'van' ? MODELS.makeVan(col) : t === 'truck' ? MODELS.makeTruck(col)
        : t === 'bus' ? MODELS.makeBus(col) : t === 'moto' ? MODELS.makeScooter(col, seed)
        : t === 'bigbike' ? MODELS.makeMotorcycle(col, seed) : t === 'bike' ? MODELS.makeBicycle(col, seed)
        : t === 'ped' ? MODELS.makePerson(col, seed) : t === 'cone' ? MODELS.makeCone()
        : MODELS.makeSedan(col);
    }
    return t === 'truck' || t === 'bus' ? makeTruck(0x8f7fd6)
      : t === 'moto' || t === 'bigbike' || t === 'bike' ? makeScooter(0xe0a63a)
      : t === 'ped' ? makePerson(0x5ef08a) : t === 'cone' ? makeCone() : makeCar(0x1f7fae);
  }
  function makeObj(t) {
    var col = paintFor(t), seed = (paintN[t] || 1) * 7919, g;
    if (window.AVM_RU) g = AVM_RU.wrap(t, function () { return buildFallback(t, col, seed); });
    else g = buildFallback(t, col, seed);
    var el = document.createElement('div');
    el.className = 'tag ' + t;
    var lab = new THREE.CSS2DObject(el);
    var ly = g.userData.labelY;
    lab.position.set(0, typeof ly === 'number' ? ly : (t === 'truck' ? 3.3 : t === 'cone' ? 1.15 : 2.3), 0);
    g.add(lab);
    g.userData.el = el;
    g.userData.lab = lab;
    return g;
  }
  function acquire(t, id) {
    var g = POOL[t].pop() || makeObj(t);
    if (window.AVM_RU) AVM_RU.dress(g, id);   // 依軌跡 id 決定車款與車色（pool 重用時外觀才穩定）
    g.userData.el.style.display = '';
    scene.add(g);
    return g;
  }
  function release(tr) {
    scene.remove(tr.mesh);
    tr.mesh.userData.el.style.display = 'none';   // CSS2D 標籤不會跟著父物件消失，要手動藏
    POOL[tr.t].push(tr.mesh);
  }

  function associate(objs, now) {
    var used = {};
    objs.sort(function (a, b) { return (b.c || 0) - (a.c || 0); });
    for (var i = 0; i < objs.length; i++) {
      var o = objs[i];
      if (!o || !NAMES[o.t]) continue;   // 不認得的類別略過
      var wx = o.x, wz = -o.z, best = null, bd = GATE[o.t], fresh = false;
      for (var j = 0; j < tracks.length; j++) {
        var tr = tracks[j];
        if (used[tr.id] || tr.t !== o.t) continue;
        var d = Math.hypot(tr.tx - wx, tr.tz - wz);
        if (d < bd) { bd = d; best = tr; }
      }
      if (!best) {
        var nid = nextId++;
        best = { id: nid, t: o.t, mesh: acquire(o.t, nid), x: wx, z: wz, tx: wx, tz: wz, yaw: 0, yawT: 0, txt: '' };
        best.mesh.position.set(wx, 0, wz);
        tracks.push(best);
        fresh = true;
      }
      used[best.id] = true;
      best.tx = wx; best.tz = wz; best.seen = now;
      // 追蹤器給的 vx/vz 是相對速度；扣掉自車速度才是對地速度（行人/自行車的動畫用）
      best.rvx = typeof o.vx === 'number' && isFinite(o.vx) ? o.vx : null;
      best.rvz = typeof o.vz === 'number' && isFinite(o.vz) ? o.vz : null;
      // yaw（弧度，正 = 車頭偏右）優先；沒有就看框比較寬 → 橫向停放的車
      if (typeof o.yaw === 'number' && isFinite(o.yaw)) best.yawT = -o.yaw;
      else if (o.t !== 'ped' && o.t !== 'cone' && o.w && o.h) best.yawT = o.w > o.h * 1.25 ? Math.PI / 2 : 0;
      if (fresh) best.yaw = best.yawT;
    }
  }

  // ---------- data in ----------
  var lastData = 0, wm = 8, hm = 6;
  var lastVeh = null, lastLca = null, lastObjs = [];
  window.setFrame = function (p) {
    var now = performance.now();
    lastData = now;
    if (p.src) setSrc(p.src);
    if (p.wm) { wm = p.wm; hm = p.hm || wm; }
    real.scale.set(wm, hm, 1);
    real.rotation.set(-Math.PI / 2, 0, p.flip ? Math.PI : 0);
    if (p.ground && groundMode === 'real') loadGround(p.ground);
    if (p.stat) showStat(p.stat, p.overlap);
    lastObjs = p.objs || [];
    associate(lastObjs, now);
    if (p.road) {
      lastRoad = now;
      matchLines(p.road.lines || [], now);
      aimEdge(edgeL, p.road.el, -1);
      aimEdge(edgeR, p.road.er, 1);
    }
    if (p.tl) { lastTl = now; showTl(p.tl); }
    // 車身訊號與盲點：模組用「物件identity」判資料新舊，每幀都要是新物件才不會被當成過期
    lastVeh = p.veh || null;
    lastLca = p.lca || null;
    if (p.slots) { slotsAt = now; drawSlots(p.slots); }
    if (window.AVM_MAP && p.map) AVM_MAP.update(p.map, now);
  };

  var statEl = document.getElementById('stat');
  function showStat(s, overlap) {
    statEl.innerHTML = '引擎 ' + s.eng + ' · 輸入 ' + s.res +
      '<br>推論 ' + s.inf + 'ms · 端到端 ' + (s.e2e || '–') + 'ms' +
      '<br>FPS ' + Number(s.fps).toFixed(1) +
      (overlap ? '<br><span class="bad">⚠ 3D 面板擋到俯視區</span>' : '');
  }

  // ---------- HUD ----------
  var LEGEND = [['car', '汽車', 'var(--cyan)'], ['van', '箱型車', '#78c8ff'],
    ['truck', '卡車', 'var(--violet)'], ['bus', '公車', '#9178dc'],
    ['moto', '機車', 'var(--amber)'], ['bigbike', '重機', '#ffa03c'], ['bike', '自行車', '#ffdc82'],
    ['ped', '行人', 'var(--green)'], ['cone', '三角錐', 'var(--orange)']];
  var rowsEl = document.getElementById('rows'), countEls = {};
  LEGEND.forEach(function (l) {
    var r = document.createElement('div');
    r.className = 'row';
    r.innerHTML = '<span class="dot" style="background:' + l[2] + '"></span><span class="nm">' + l[1] +
      '</span><span class="ct" style="color:' + l[2] + '">0</span>';
    rowsEl.appendChild(r);
    countEls[l[0]] = r.querySelector('.ct');
  });
  var alertEl = document.getElementById('alert'), waitEl = document.getElementById('wait');

  // ---------- views ----------
  var VIEWS = {
    top: { pos: [0, 22, 0.01], tgt: [0, 0, 0], rot: false },
    chase: { pos: [0, 7.5, 10.5], tgt: [0, 0, -1.5], rot: false },
    orbit: { pos: [9, 7, 9], tgt: [0, 0, 0], rot: true },

  // ---------- 校正（直接寫回 Android 設定，偵測服務下一幀就生效） ----------
  var calBtn = document.getElementById('calBtn'), cal = document.getElementById('cal');
  var cL = document.getElementById('cL'), cR = document.getElementById('cR'),
    cT = document.getElementById('cT'), cB = document.getElementById('cB'),
    cM = document.getElementById('cM'), cF = document.getElementById('cF'), cO = document.getElementById('cO');
  function readPrefs() {
    var p = { l: 0.03, t: 0, r: 0.48, b: 0.86, meters: 8, flip: false, realGround: true, roiOnly: true,
      groundMode: DEMO ? 'virtual' : '', src: DEMO_CAM ? 'cam' : 'screen' };
    if (Bridge) { try { p = JSON.parse(Bridge.getPrefs()); } catch (e) {} }

  function syncOut() {

  function loadCal() {

    cT.value = (p.t * 100).toFixed(1); cB.value = (p.b * 100).toFixed(1);
    cM.value = p.meters; cF.checked = !!p.flip; cO.checked = p.roiOnly !== false;
    syncOut();
  }
  function pushRoi() {
    var l = +cL.value, r = +cR.value, t = +cT.value, b = +cB.value;
    if (r - l < 3) { r = Math.min(100, l + 3); cR.value = r; }
    if (b - t < 3) { b = Math.min(100, t + 3); cB.value = b; }
    syncOut();
    if (Bridge) Bridge.setRoi(l / 100, t / 100, r / 100, b / 100);
  }
  [cL, cR, cT, cB].forEach(function (el) { el.addEventListener('input', pushRoi); });
  cM.addEventListener('input', function () { syncOut(); if (Bridge) Bridge.setMeters(+cM.value); });

  // 存目前整張螢幕截圖給離線校正；Android 存完回呼 window.onSaved(訊息)

  // 來源：screen = 擷取全景360 畫面；cam = Camera2 直讀（鏡頭畫面有自己的原生控制，不用校正抽屜）
  var srcMode = '';

    s = s === 'cam' ? 'cam' : 'screen';
    if (s === srcMode) return;
    srcMode = s;
    waitEl.innerHTML = s === 'cam' ? '等待鏡頭畫面…<br><small>Camera2 直讀模式</small>'
      : '等待偵測資料…<br><small>把全景360 切到俯視畫面</small>';
    calBtn.hidden = s === 'cam';
    if (s === 'cam') { cal.hidden = true; calBtn.setAttribute('aria-pressed', 'false'); }
  }

  (function initPrefs() {
    var p = readPrefs(), m = p.groundMode;

  })();

  // ---------- resize ----------
  var dockEl = document.getElementById('dock');
  function resize() {
    var w = app.clientWidth || window.innerWidth, h = app.clientHeight || window.innerHeight;
    renderer.setSize(w, h);
    labels.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    // 視窗太窄、號誌會撞到 dock 時改放到 dock 上方
    var d = dockEl.getBoundingClientRect();
    tlEl.style.bottom = d.right > w - 150 ? Math.round(h - d.top + 8) + 'px' : '';
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- loop（限 30fps，把 GPU 留給偵測） ----------
  var lastT = 0;
  function update(dt, now) {
    var k = 1 - Math.pow(0.002, dt);   // 位置平滑
    var counts = { car: 0, van: 0, truck: 0, bus: 0, moto: 0, bigbike: 0, bike: 0, ped: 0, cone: 0 };
    var anyWarn = false, anyCrit = false, ts = now / 1000;
    // 車速停止更新就當 0，不然行人會一直踏步、車輪一直轉
    var fresh = now - lastData < 1500;
    var egoKmh = fresh && lastVeh && typeof lastVeh.speed === 'number' && isFinite(lastVeh.speed) ? lastVeh.speed : 0;
    var egoMps = (lastVeh && lastVeh.gear === 'R' ? -egoKmh : egoKmh) / 3.6;
    for (var i = tracks.length - 1; i >= 0; i--) {
      var tr = tracks[i];
      if (now - tr.seen > 900) { release(tr); tracks.splice(i, 1); continue; }
      tr.x += (tr.tx - tr.x) * k;
      tr.z += (tr.tz - tr.z) * k;
      var dy = tr.yawT - tr.yaw;
      tr.yaw += Math.atan2(Math.sin(dy), Math.cos(dy)) * k;   // 走最短的方向轉
      tr.mesh.position.set(tr.x, 0, tr.z);
      tr.mesh.rotation.y = Math.PI + tr.yaw;
      counts[tr.t]++;
      var anim = tr.mesh.userData.animate;
      if (anim) anim(ts, tr.rvz === null ? 0 : Math.hypot(tr.rvx || 0, tr.rvz + egoMps));

      // 跟自車車身的淨距離（車身外框 → 物件邊緣）
      var dx = Math.max(Math.abs(tr.x) - EGO_W / 2, 0), dz = Math.max(Math.abs(tr.z) - EGO_L / 2, 0);
      var clr = Math.max(0, Math.hypot(dx, dz) - RADIUS[tr.t]);
      var warn = clr < WARN, crit = clr < CRIT;
      tr.clr = clr;
      if (warn) anyWarn = true;
      if (crit) anyCrit = true;
      var p = tr.mesh.userData.paint;
      if (warn) {
        p.emissive.setHex(COL.red);
        p.emissiveIntensity = (crit ? 0.9 : 0.45) * (0.6 + 0.4 * Math.sin(now / 110));
      } else {
        p.emissive.setHex(p.userData.baseEm);
        p.emissiveIntensity = p.userData.baseEmI;
      }
      var txt = NAMES[tr.t] + ' <b>' + clr.toFixed(1) + 'm</b>', cls = 'tag ' + tr.t + (warn ? ' danger' : '');
      var el = tr.mesh.userData.el;
      if (tr.txt !== txt) { el.innerHTML = txt; tr.txt = txt; }
      if (el.className !== cls) el.className = cls;
    }
    // 三角錐常成排出現：2 m 內一群只標最近的一個，標籤才不會疊成一團
    if (counts.cone) {
      for (i = 0; i < tracks.length; i++) {
        var a = tracks[i], show = true;
        if (a.t !== 'cone') continue;
        for (var j = 0; j < tracks.length && show; j++) {
          var b = tracks[j];
          if (b !== a && b.t === 'cone' && (b.clr < a.clr || (b.clr === a.clr && b.id < a.id)) &&
            Math.hypot(b.x - a.x, b.z - a.z) < 2) show = false;
        }
        a.mesh.userData.lab.visible = show;   // CSS2DRenderer 依 visible 決定顯示
      }
    }
    for (var t in counts) countEls[t].textContent = counts[t];
    alertEl.hidden = !anyWarn;
    alertEl.textContent = anyCrit ? '⚠ 距離過近' : '⚠ 碰撞預警';
    waitEl.hidden = now - lastData < 2000;

    updateRoad(dt, now);

    // ---------- 外掛模組每幀更新 ----------
    if (egoModel && egoModel.userData.animate) egoModel.userData.animate(ts, egoMps);
    var pdcOn = false;
    if (window.AVM_VEH) {
      AVM_VEH.update(lastVeh, now);
      var vst = AVM_VEH.state();
      pdcOn = !!(vst && vst.pdcActive && vst.pdcMin);   // 雷達真的測到東西才讓位，全無障礙時不算
      // 倒車／前方極近時自動換視角，訊號結束再還給使用者原本選的。
      // 只在「建議值變了」才接管：倒車中使用者自己按視角鈕（會清掉 autoView）就不再搶回去。
      // 建議值要穩定 600 ms 才採用，雷達在門檻上下跳動時視角才不會亂閃
      var want = AVM_VEH.suggestView();
      if (want !== pendView) { pendView = want; pendAt = now; }
      if (pendView !== lastSuggest && now - pendAt > 600) {
        if (pendView) { autoView = pendView; setView(pendView); }
        else if (autoView) { autoView = null; setView(userView); }
        lastSuggest = pendView;
      }
    }
    // 雷達在測到東西時由弧線負責距離提示，安全距離框淡一點免得兩套蓋在一起；
    // 但雷達只看前後，側邊是鏡頭抓的，所以紅色警告照常保留。
    warnBand.material.color.setHex(anyWarn ? COL.red : COL.cyan);
    warnBand.material.opacity = (anyWarn ? 0.35 + 0.3 * Math.abs(Math.sin(now / 160)) : 0.22)
      * (pdcOn ? 0.45 : 1);
    if (window.AVM_MAP) AVM_MAP.update(null, now);
    if (window.AVM_LCA) AVM_LCA.update(lastLca, lastObjs, now);
    // 停車格：來源停送就收起來
    if (slotsAt > 0 && now - slotsAt > SLOT_TTL) { drawSlots(null); slotsAt = -1e9; }

    // 號誌：1.5 s 沒資料就收起來
    var tlOn = now - lastTl < 1500;
    if (tlEl.hidden === tlOn) tlEl.hidden = !tlOn;
    if (tlOn && !tlObj.visible) tlAx = tlAxT;   // 剛出現直接到位
    tlObj.visible = tlOn;
    if (tlOn) {
      tlAx += (tlAxT - tlAx) * k;
      var X = TL_D * Math.sin(tlAx), Z = -TL_D * Math.cos(tlAx);
      tlObj.position.set(X, 0, Z);
      tlObj.rotation.y = Math.atan2(-X, -Z);   // 燈面朝自車
    }
  }
  function loop(t) {
    requestAnimationFrame(loop);
    if (t - lastT < 32) return;
    var dt = Math.min((t - lastT) / 1000, 0.1);
    lastT = t;
    update(dt, performance.now());
    controls.update();
    renderer.render(scene, camera);
    labels.render(scene, camera);
  }
  requestAnimationFrame(loop);

  // ---------- 示範資料（瀏覽器預覽用：index.html#demo、#demo-cam） ----------
  if (DEMO) {
    // 除錯用（僅示範模式）
    window.__bev3d = { renderer: renderer, camera: camera, controls: controls, lines: lineTracks,
      scene: scene, road: road, strip: strip };
    var demoGround = (function () {
      var c = document.createElement('canvas'); c.width = 256; c.height = 192;
      var g = c.getContext('2d');
      g.fillStyle = '#3a3f46'; g.fillRect(0, 0, 256, 192);
      for (var i = 0; i < 2500; i++) { var v = 50 + Math.random() * 40; g.fillStyle = 'rgba(' + v + ',' + v + ',' + (v + 6) + ',.25)'; g.fillRect(Math.random() * 256, Math.random() * 192, 2, 2); }
      g.fillStyle = '#d9d2b0';
      [40, 216].forEach(function (x) { g.fillRect(x, 0, 3, 192); });
      for (var y = 10; y < 192; y += 34) { g.fillRect(0, y, 40, 3); g.fillRect(216, y, 40, 3); }
      g.fillStyle = '#5b6a3a'; g.fillRect(0, 0, 18, 192); g.fillRect(238, 0, 18, 192);
      return c.toDataURL('image/jpeg', 0.7);
    })();
    var jit = function (a) { return (Math.random() - 0.5) * a; };
    var n = 0;
    // 停在紅燈前：雙黃實線（-1.95/-1.80）、右側白虛線 +1.75、右路緣 +3.6 帶紅線、左路緣未知、前方 8 m 停止線
    setInterval(function () {
      var s = performance.now() / 1000, cyc = s % 12;
      var zOver = -14 + ((s * 9) % 26);      // 後方左車道一台快速接近的車
      var objs = [
        { t: 'car', x: -3.0, z: 0.3, w: 1.8, h: 4.4, c: 0.62, id: 11, vx: 0, vz: 0 },
        { t: 'car', x: 2.75, z: -1.5 + Math.sin(s * 0.5) * 2.5, w: 1.8, h: 4.4, c: 0.55, id: 12, vx: 0, vz: Math.cos(s * 0.5) * 1.25 },
        { t: 'van', x: -3.1, z: 7.6, w: 1.9, h: 4.9, c: 0.58, id: 13, vx: 0, vz: 0 },
        { t: 'bus', x: 6.2, z: 9.0, w: 2.5, h: 11.5, c: 0.52, id: 14, vx: 0, vz: 0 },
        { t: 'ped', x: Math.sin(s * 0.35) * 4, z: 4.0, w: 0.5, h: 0.5, c: 0.7, id: 15, vx: Math.cos(s * 0.35) * 1.4, vz: 0 },
        { t: 'moto', x: 1.2 + Math.sin(s) * 0.25, z: -4.6, w: 0.6, h: 1.6, c: 0.5, id: 16, vx: 0, vz: 0.4 },
        { t: 'bigbike', x: -1.3, z: -7.5, w: 0.8, h: 2.1, c: 0.48, id: 17, vx: 0, vz: 1.2 },
        { t: 'bike', x: 4.2, z: 2.2, w: 0.6, h: 1.75, c: 0.45, id: 18, vx: 0, vz: 1.0 },
        { t: 'car', x: -3.45, z: zOver, w: 1.8, h: 4.4, c: 0.6, id: 19, vx: 0, vz: 9 },
        { t: 'cone', x: 3.1 + jit(0.04), z: 5.2 + jit(0.04), w: 0.4, h: 0.4, c: 0.8, id: 20 },
        { t: 'cone', x: 2.75 + jit(0.04), z: 6.2 + jit(0.04), w: 0.4, h: 0.4, c: 0.75, id: 21 },
        { t: 'cone', x: 2.4 + jit(0.04), z: 7.2 + jit(0.04), w: 0.4, h: 0.4, c: 0.7, id: 22 }
      ];
      var rd = { el: null, er: 3.6 + jit(0.06), lines: [
        { k: 'y', d: 0, x1: -1.95 + jit(0.04), z1: -6.6, x2: -1.95 + jit(0.04), z2: 6.8, c: 1 },
        { k: 'y', d: 0, x1: -1.80 + jit(0.04), z1: -6.5, x2: -1.80 + jit(0.04), z2: 6.8, c: 1 },
        { k: 'w', d: 1, x1: 1.75 + jit(0.04), z1: -6.0, x2: 1.75 + jit(0.04), z2: 6.9, c: 0.8 },
        { k: 'r', d: 0, x1: 3.5 + jit(0.04), z1: -6.8, x2: 3.5 + jit(0.04), z2: 6.8, c: 0.9 },
        { k: 'w', d: 0, x1: -1.65, z1: 8 + jit(0.06), x2: 3.45, z2: 8 + jit(0.06), c: 0.7 }
      ] };
      // 車身訊號：打左方向燈準備變道，左後有車 → 盲點警告；每 12 s 進一次倒車
      var rev = cyc > 10.5;
      var veh = rev
        ? { turn: null, lit: null, gear: 'R', steer: Math.sin(s * 0.6) * 180, speed: 3,
            pdc: { f: [99, 99, 99, 99], r: [1.6, 0.9, 0.7 + jit(0.05), 1.4] } }
        : { turn: 'L', lit: (s * 1.5) % 1 < 0.5, gear: 'D', steer: Math.sin(s * 0.3) * 25, speed: 42,
            pdc: { f: [99, 99, 99, 99], r: [99, 99, 99, 99] } };
      var ttc = zOver < -1 ? (-zOver - 1) / 9 : null;
      var lca = {
        L: zOver > -16 && zOver < -1 ? (ttc !== null && ttc < 2.2 ? 2 : 1) : 0, R: 0,
        intent: rev ? null : 'L',
        path: rev ? null : [[0, 0], [0.1, 2], [0.5, 4], [1.3, 6], [2.3, 8], [3.1, 10], [3.5, 12]],
        pathOk: !(zOver > -16 && zOver < -1),
        threat: ttc !== null ? { id: 19, ttc: ttc } : null,
        zones: { L: [-5.25, -12.42, -1.75, 1], R: [1.75, -12.42, 5.25, 1] }
      };
      // 停車格：右側三格垂直停車位，中間那格有車
      var slots = [];
      for (var si = 0; si < 3; si++) {
        var z0 = 1.2 + si * 2.6;
        slots.push({ p: [2.2, z0, 2.2, z0 + 2.4, 7.2, z0 + 2.4, 7.2, z0], k: 'p', o: si === 1 ? 1 : 0, c: 0.8 });
      }
      var mapPts = [];
      for (var mi = -4; mi <= 24; mi++) mapPts.push([Math.sin(mi * 0.06) * 1.4, mi * 4]);
      var mp = { t: n, path: mapPts, matched: true, spd: rev ? 3 : 42, off: 0.3, od: s * 11,
        lanes: 2, hw: 'secondary', oneway: 0, maxspeed: 50, name: '示範路', signals: [120, 420],
        roads: [mapPts], rc: [1], acc: 6 };
      window.setFrame({ objs: objs, wm: 8, hm: 6, flip: false, ground: (n++ % 10 === 0) ? demoGround : null,
        stat: { eng: 'GPU', res: 320, inf: 48, e2e: 66, fps: 9.6 }, road: rd,
        tl: { s: cyc < 5 ? 'red' : cyc < 10 ? 'green' : 'yellow', c: 0.86, ax: 4 },
        veh: veh, lca: lca, slots: slots, map: mp,
        src: DEMO_CAM ? 'cam' : 'screen' });
    }, 150);
  }
})();
</script>
</body>
</html>
